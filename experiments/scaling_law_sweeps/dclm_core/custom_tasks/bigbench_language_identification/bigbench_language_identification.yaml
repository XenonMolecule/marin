# Custom lm-eval-harness task for DCLM CORE's `bigbench_language_identification`.
#
# Why custom: stock lm-eval's `bigbench_language_identification_multiple_choice`
# pulls the `hails/bigbench` HF dataset, which has ELEVEN full-language-name
# choices per example (random baseline ~9%). DCLM's CoreV2 spec is FOUR-choice
# (random baseline 25%) — DCLM uses MosaicML llm-foundry's eval-gauntlet data,
# not the HF dataset. The 11-choice version is both ~10x slower (110k vs 40k
# multi-token loglikelihood requests, no context sharing) AND off-reference.
#
# Source: MosaicML llm-foundry eval gauntlet — n=10000, matches DCLM's
# eval_meta_data.csv exactly ("10,000 four-choice"):
# https://github.com/mosaicml/llm-foundry/blob/main/scripts/eval/local_data/language_understanding/bigbench_language_identification.jsonl
#
# Format: MosaicML "multiple_choice" (letter-MCQ). Each row has `query` (the
# sentence plus the 4 lettered options and "Answer: "), `choices` = ["A","B",
# "C","D"] (single tokens), and `gold` = the correct index. Scoring picks the
# highest-loglikelihood letter -> acc. DCLM runs this 10-shot.
task: bigbench_language_identification
dataset_path: json
dataset_kwargs:
  data_files: bigbench_language_identification.jsonl
test_split: train
output_type: multiple_choice
doc_to_text: "{{query}}"
doc_to_target: "{{gold}}"
doc_to_choice: "{{choices}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
  source: mosaicml/llm-foundry eval gauntlet
  dclm_meta_row: "bigbench_language_identification,language understanding,multiple choice,10,10000,25"
