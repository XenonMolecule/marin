# Custom lm-eval task for DCLM CORE's `coqa` (per-question, DCLM variant).
#
# DCLM scores this as icl_task_type=language_modeling → MosaicML's
# InContextLearningLMAccuracy: teacher-force the gold continuation and score 1 iff
# EVERY continuation token is the greedy argmax given the prefix (one forward pass).
# lm-eval reproduces this exactly with output_type=loglikelihood + metric=acc, where
# for loglikelihood tasks `acc = int(is_greedy)` (see lm_eval/api/task.py). This is
# both faithful to DCLM (NOT the looser/slower generate_until string match) and fast
# (one forward pass, like the MC tasks). Precedent: lambada_openai uses the same.
#
# The context already ends with "...\nAnswer: " (trailing space), so target_delimiter
# is "" — the space comes from the context, matching MosaicML's joint tokenization.
# Stock lm-eval `coqa` scores only ~500 per-story last-turns with F1; DCLM scores 7983
# per-question. Distinct name avoids colliding with built-in `coqa`.
#
# Source: mosaicml/llm-foundry scripts/eval/local_data/reading_comprehension/coqa.jsonl (7983 rows)
# DCLM eval_meta_data row: coqa,reading comprehension,language modeling,0,7983,0
task: coqa_dclm
dataset_path: json
dataset_kwargs:
  data_files: coqa.jsonl
test_split: train
output_type: loglikelihood
doc_to_text: "{{ context | trim }}"
doc_to_target: " {{continuation}}"
target_delimiter: ""
fewshot_delimiter: "\n"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 2.0
  source: mosaicml/llm-foundry eval gauntlet (per-question CoQA)
  dclm_meta_row: "coqa,reading comprehension,language modeling,0,7983,0"
