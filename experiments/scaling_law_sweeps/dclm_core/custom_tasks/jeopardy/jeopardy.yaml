# Custom lm-eval-harness task for DCLM CORE's `jeopardy`.
#
# Source: MosaicML llm-foundry eval gauntlet — jeopardy_all.jsonl (n=2117, matches
# DCLM's eval_meta_data.csv). DCLM overrides MosaicML's 3-shot to 10-shot; we honor 10.
#
# DCLM scores this as icl_task_type=language_modeling -> MosaicML InContextLearningLMAccuracy:
# teacher-force the gold continuation, score 1 iff EVERY continuation token is the greedy
# argmax given the prefix (one forward pass). lm-eval reproduces this exactly with
# output_type=loglikelihood + metric=acc (acc = is_greedy; see lm_eval/api/task.py) — faithful
# to DCLM and fast. (Previously approximated with generate_until + exact_match, which diverges
# in both score and speed.) DCLM sets continuation_delimiter="\nAnswer: " for this task.
task: jeopardy
dataset_path: json
dataset_kwargs:
  data_files: jeopardy_all.jsonl
test_split: train
output_type: loglikelihood
# Bake the "\nAnswer: " delimiter into the PROMPT (doc_to_text) with target_delimiter: "",
# so is_greedy scores ONLY the answer tokens — matching MosaicML, which puts the
# continuation_delimiter in ctxt. (target_delimiter is prepended to the scored continuation
# in lm-eval, so leaving it non-empty would wrongly score the delimiter tokens too.)
doc_to_text: "{{ context | trim }}\nAnswer:"
doc_to_target: " {{continuation}}"
target_delimiter: ""
fewshot_delimiter: "\n"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 2.0
  source: mosaicml/llm-foundry@v0.9.0
  dclm_meta_row: "jeopardy,world knowledge,language modeling,10,2117,0"
