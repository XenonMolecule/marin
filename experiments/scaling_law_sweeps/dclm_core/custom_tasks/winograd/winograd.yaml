# Custom lm-eval-harness task for DCLM CORE's `winograd` (Winograd Schema Challenge, WSC273).
#
# Why custom + why replaced (v2): the previous version vendored WSCollection.xml
# (285 schemas) scored as plain multiple_choice. DCLM CoreV2 uses MosaicML
# llm-foundry's WSC273 (273 rows) with the "schema" task type: score
# P(continuation | each option-substituted context), argmax. We mirror lm-eval's
# native `winogrande` schema mechanism (doc_to_choice = the two contexts,
# doc_to_target = the shared continuation, doc_to_text = the gold index) on DCLM's
# 273-row jsonl, so both the data (273 not 285) and the scoring match DCLM.
#
# Source: mosaicml/llm-foundry scripts/eval/local_data/language_understanding/winograd_wsc.jsonl
# DCLM eval_meta_data row: winograd,language understanding,schema,0,273,50
task: winograd
dataset_path: json
dataset_kwargs:
  data_files: winograd_wsc.jsonl
test_split: train
output_type: multiple_choice
doc_to_text: !function preprocess_winograd.doc_to_text
doc_to_target: !function preprocess_winograd.doc_to_target
doc_to_choice: !function preprocess_winograd.doc_to_choice
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 2.0
  source: mosaicml/llm-foundry eval gauntlet (WSC273)
  dclm_meta_row: "winograd,language understanding,schema,0,273,50"
